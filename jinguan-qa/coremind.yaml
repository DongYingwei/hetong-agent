schemaVersion: 2
name: jinguan-qa
description: 经小管合同查询智能体（SQL 结构化统计 + 向量语义检索）

# ─────────────────────────────────────────────────────────────
# Provider：换成你的真实模型。DeepSeek 示例如下；也可用 OpenAI-compatible 端点。
# apiKeyEnv 指向环境变量名，密钥不写进 YAML。
# ─────────────────────────────────────────────────────────────
provider:
  id: deepseek
  apiKeyEnv: DEEPSEEK_API_KEY
  # model: deepseek-chat   # 缺省用 provider 默认

# ─────────────────────────────────────────────────────────────
# 工具：两个只读工具。effect 声明为 read → assisted 模式下自动放行、不打断 ReAct。
# 真正的 SQL 安全（只 SELECT）在 sql_query.ts 内部把关 + 数据库用只读账号兜底。
# ─────────────────────────────────────────────────────────────
tools:
  - path: ./src/sql_query.ts
    name: sql_query
    effect:
      operations: [read]
      reversible: true
  - path: ./src/vector_search.ts
    name: vector_search
    effect:
      operations: [read]
      reversible: true

agents:
  main:
    # ───────────────────────────────────────────────────────
    # systemPrompt = 你的“Query Planner”。CoreMind 没有独立 Planner 组件，
    # 提问路由（走 SQL / 向量 / 联动）就靠这段引导 + 下面 skill 注入的数据字典。
    #
    # ⚠️ 当前日期必须注入（模型不知道今天几号）。
    #    注意：systemPrompt 不做 {{}} 插值（插值只在 workflow/loop 的 input 里生效）。
    #    因此当前日期有两种注入法，二选一：
    #      A. 每天/每次运行前用脚本把下面这行的日期字面量替换掉（sed/模板渲染）；
    #      B. 用 SDK 调用时，把“今天是 YYYY-MM-DD”拼进 initialPrompt 或改写 systemPrompt。
    #    下面先写一个固定日期占位，务必按上面方式改成真实当天日期。
    # ───────────────────────────────────────────────────────
    systemPrompt: |
      你是“经小管”合同查询助手。今天是 2026-08-10（此日期需在运行前替换为真实当天日期）。
      你的任务：把用户关于【合同库】的自然语言提问翻译成查询，并以 Markdown 表格汇总结果。

      # 能力边界（第一步先判断，宁可诚实拒答也不要编造）
      你只能回答“下方专业技能里的 contracts 表结构能支撑的合同统计与检索问题”。
      收到提问后，先判断它是否落在这个范围内：
      - 若提问需要的过滤维度或数据【不在】表结构里（例如：合同的付款进度、履约状态、
        供应商联系人、法律条款解读、与外部系统的数据、对未来的预测等），
        不要臆造列名、不要编造 SQL、不要给出任何数字。直接回答：
        “这个问题超出当前合同库能查询的范围。我目前能查询：按行业/合同类型/AI或通信标签/
        年份/季度做数量统计、金额求和、编号名称列表。请换一个这类问题，或联系管理员扩充数据字段。”
      - 若提问【不是】合同查询（闲聊、常识、写代码、其他业务），同样礼貌说明你只负责合同库查询。
      - 只有确认提问落在可查询范围内，才继续下面的路由与查询。
      宁可少答、诚实说“查不了”，也绝不允许为了显得“什么都会”而编造结果。

      # 提问路由规则（严格执行）
      1. 若提问的过滤条件都能对应到已知列（行业 / 合同类型 / 标签 / 年份 / 季度 / 金额），
         只调用 sql_query。
      2. 若提问包含“类似 / 相似 / 相关”等语义词，或关键词不在已知标签体系里，
         先调用 vector_search 得到 contract_ids，等它返回后，再调用 sql_query
         并把这些 id 传入 contract_ids 参数做统计。
      3. 拿不准时优先 sql_query；结果为空再考虑 vector_search。
      4. 禁止在同一轮里同时调用两个工具：sql_query 依赖 vector_search 的输出。

      # 生成 SQL 的纪律
      - 严格依据下方“专业技能”里的表结构，不得臆造列名。
      - 只能生成 SELECT 查询；禁止 INSERT/UPDATE/DELETE/DROP 等写操作。
      - 时间词一律按技能里的映射表转成 sign_year / sign_quarter / sign_half，不得自行推理季度对应的月份。
      - 未指定年份时，默认按今天所在年份（见上方日期）过滤，并在输出末尾用一行声明该假设，例如：
        “> 假设：未指定年份，按 2026 年统计。”

      # 输出格式
      - 用 Markdown 表格呈现结果（列名用中文）。
      - “有多少” → 给出数量；“总金额” → 给出求和值并带单位（元）；“有哪些/编号” → 列出编号与名称。
      - 结果为空时明确说“未查询到符合条件的合同”，不要编造。
    skills:
      - jinguan-schema

# ─────────────────────────────────────────────────────────────
# 护栏：只读查询回合很短。maxToolCalls=3 允许“向量→SQL”两步 + 冗余一次。
# ─────────────────────────────────────────────────────────────
runtime:
  maxTurns: 6
  maxSteps: 12
  maxToolCalls: 3
  maxToolFailures: 2
  maxRetries: 1
  runTimeoutMs: 60000

# ─────────────────────────────────────────────────────────────
# 记忆层：开 Session，支持多轮追问（“那第三季度呢？”“换成通信行业呢？”）。
# 用 `coremind chat coremind.yaml --session <id>` 进入多轮模式。
# compact：上下文超预算时自动 LLM 摘要（消耗 token，显式开启）。
# ─────────────────────────────────────────────────────────────
session:
  enabled: true
  dir: ./sessions
  compact: true

# ─────────────────────────────────────────────────────────────
# 权限：assisted = 工作区内只读工具自动放行，不逐项弹审批。
# network: deny —— 工具连 DB/向量库的网络细节封在工具内部（连接串从 env 读），
# 对 CoreMind 只暴露 read 语义，不触发网络策略。
# ─────────────────────────────────────────────────────────────
permissions:
  mode: assisted
  workspaceOnly: true
  network: deny

# ─────────────────────────────────────────────────────────────
# 质量门禁：evals/scenarios.yaml 的通过率即你 >90% 准确率的证据基线。
# ─────────────────────────────────────────────────────────────
quality:
  profile: standard
  minScenarioPassRate: 0.9
  allowOverride: true
