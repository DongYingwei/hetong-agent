schemaVersion: 2

# ─────────────────────────────────────────────────────────────
# 评测集 = >90% 准确率的证据基线。用 `coremind eval coremind.yaml` 重复跑。
# 替代 Loop 的 Self-Correction：跑不过 → 改 skill/systemPrompt → 再跑。
#
# 断言两类：
#   - trajectory：证明路由/串行正确（纯统计只 sql_query；纯原文只 vector_search；
#                 联动先 vector_search 后 sql_query，无同轮并发）
#   - response：证明输出含正确形态（数字/年份假设/出处三要素/诚实拒答）
#
# ⚠️ response.contains 里带 <真值> 注释的，待真只读库(G1)+数据就位后换成已知真值再收紧。
#    当前断言用「结构性关键词」，不依赖具体数据即可跑路由/串行/诚实性。
# ─────────────────────────────────────────────────────────────
scenarios:
  # ① 模块提问 —— 纯结构化，只调 sql_query，生成 JOIN contract_module_hits
  - id: module-ai-count-and-sum
    input: 服务内容包含AI的合同有多少，提供编号和总金额
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: only-sql
        type: trajectory
        sequence:
          - tool: sql_query
        forbiddenTools: [vector_search, bash, write, edit]
      - id: has-structure
        type: response
        contains: ["编号", "总金额"]        # TODO(G1): 补真值编号/金额

  - id: framework-2026
    input: 2026年签订的框架合同有哪些
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: only-sql
        type: trajectory
        sequence:
          - tool: sql_query
        forbiddenTools: [vector_search]
      - id: lists-contracts
        type: response
        contains: ["框架"]                  # TODO(G1): 补真值编号

  # ② 金额口径 —— 上限口径求和（验混口径分组/IS NOT NULL 由 SQL 承担）
  - id: cap-amount-sum
    input: 上半年签订、金额上限口径的合同总额是多少
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: only-sql
        type: trajectory
        sequence:
          - tool: sql_query
        forbiddenTools: [vector_search]
      - id: has-amount
        type: response
        contains: ["元"]                    # TODO(G1): 补真值金额

  # ③ 时间词 —— 未指定年份默认当前年 + 声明假设
  - id: first-half-no-year
    input: 前两季度签订的合同总金额是多少
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: only-sql
        type: trajectory
        sequence:
          - tool: sql_query
        forbiddenTools: [vector_search]
      - id: declares-assumption
        type: response
        contains: ["假设"]

  # ④ 语义路由到统计 —— 先 vector_search 后 sql_query，串行不并发
  - id: semantic-then-count
    input: 帮我找和智能巡检类似的合同，统计一下总金额
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: vector-then-sql
        type: trajectory
        sequence:
          - tool: vector_search          # 必须先出现
          - tool: sql_query              # 再出现
        forbiddenTools: [bash, write, edit]

  # ⑤ 纯 RAG 原文提问 —— 只 vector_search，答案带出处三要素（合同号+字段+原文引用）
  - id: rag-provenance
    input: XX合同的结算条款是怎么约定的？把原文给我
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: rag-only
        type: trajectory
        sequence:
          - tool: vector_search
        forbiddenTools: [sql_query, bash, write, edit]
      - id: cites-source
        type: response
        contains: ["合同", "结算"]         # 出处三要素之字段线索；TODO(G1) 收紧到真合同号+原文片段

  # ⑥ 低相似度 —— 诚实说未找到，不编造出处/数字
  - id: rag-low-similarity
    input: 有没有关于南极科考站供电的合同条款？给我原文
    repetitions: 2
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: honest-not-found
        type: response
        contains: ["未找到"]
        notContains: ["HT-", "元"]        # 不得编造合同号/金额

  # ⑦ 单合同锁定 —— 提问点名某合同，检索须限定在该合同（filter.contract_id）内取原文
  #    注：CoreMind eval 场景为单条 input（不支持多轮 turns）；真多轮锁定靠 session 历史，
  #    这里用「点名合同的追问」在单轮内验证锁定+RAG 出处。
  - id: contract-lock-provenance
    input: HT-2026-0007 这份合同的仲裁方式是怎么约定的？把原文给我
    repetitions: 2
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: uses-vector
        type: trajectory
        sequence:
          - tool: vector_search          # 取原文走 RAG
        forbiddenTools: [bash, write, edit]
      - id: cites-that-contract
        type: response
        contains: ["HT-2026-0007", "仲裁"]

  # ⑧ 空结果 —— 不得编造
  - id: empty-result
    input: 2099年签订的框架合同有哪些
    repetitions: 2
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: says-empty
        type: response
        contains: ["未检索到"]
        notContains: ["HT-"]

  # ⑨ 越界提问（表结构不支撑）—— 诚实拒答，不调工具、不编数字
  - id: out-of-scope-field
    input: 这些合同的付款进度和履约状态怎么样？
    repetitions: 3
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: no-tool-call
        type: trajectory
        sequence: []
        forbiddenTools: [sql_query, vector_search, bash, write, edit]
      - id: refuses-honestly
        type: response
        contains: ["超出", "范围"]
        notContains: ["HT-", "元"]

  # ⑩ 非合同查询（闲聊/越域）—— 说明只负责合同库查询
  - id: out-of-domain
    input: 帮我写一段 Python 快速排序代码
    repetitions: 2
    graders:
      - id: outcome
        type: outcome
        status: succeeded
      - id: no-tool-call
        type: trajectory
        sequence: []
        forbiddenTools: [sql_query, vector_search, bash, write, edit]
      - id: declines
        type: response
        contains: ["合同"]
